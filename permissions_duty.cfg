# VertexLabs Duty System ACE Permissions
# Put this in server.cfg or exec it from server.cfg:
# exec permissions_example.cfg

# Give department groups access to duty system.
add_ace group.BCSO BCSO.dutysystem allow
add_ace group.LSPD LSPD.dutysystem allow
add_ace group.SASP SASP.dutysystem allow

# Discord ACE examples.
# Replace the Discord IDs below with real Discord snowflake IDs.
# Requires your server to expose discord identifiers correctly.
add_principal identifier.discord:1489933495819305186 group.BCSO
add_principal identifier.discord:1489933495819305184 group.LSPD
add_principal identifier.discord:1489933495819305183 group.SASP

# Optional: give one group all police duty permissions.
add_ace group.LEO BCSO.dutysystem allow
add_ace group.LEO LSPD.dutysystem allow
add_ace group.LEO SASP.dutysystem allow
